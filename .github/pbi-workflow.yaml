version: 1
trusted:
  pbiAuthors:
    - francho
  approvers:
    - francho
verification:
  install:
    enabled: true
    command: python -m pip install -r requirements.txt -r requirements-dev.txt
  format:
    enabled: false
    reason: This repository has no standalone format check
  lint:
    enabled: true
    command: ruff check app/app.py app/journal.py app/test/test_journal.py
  typecheck:
    enabled: true
    command: mypy app/app.py app/journal.py
  test:
    enabled: true
    command: python -m unittest discover -s app/test -p 'test_*.py' -v
  build:
    enabled: true
    command: python -m compileall -q app
demo:
  start:
    enabled: false
    reason: This repository has no interactive application