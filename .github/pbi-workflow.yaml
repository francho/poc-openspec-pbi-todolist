version: 1
trusted:
  pbiAuthors:
    - francho
  approvers:
    - francho
verification:
  install:
    enabled: true
    command: python -m pip install -r requirements.txt -r requirements-dev.txt
  format:
    enabled: false
    reason: This repository has no standalone format check
  lint:
    enabled: true
    command: ruff check app
  typecheck:
    enabled: true
    command: mypy app/
  test:
    enabled: true
    command: python -m unittest discover -s app/test -p 'test_*.py' -v
  build:
    enabled: true
    command: python -m compileall -q app
demo:
  start:
    enabled: true
    command: JOURNAL_DATABASE=artifacts/demo/runtime.sqlite3 python -m flask --app app run --host 127.0.0.1 --port 5055
  capture:
    command: python -m app.demo --base-url http://127.0.0.1:5055 --scenarios-from-change
    artifactsDirectory: artifacts/demo
  url: http://127.0.0.1:5055/
  readinessUrl: http://127.0.0.1:5055/health