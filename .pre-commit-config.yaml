repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check app/app.py app/journal.py app/test/test_journal.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy app/app.py app/journal.py
        language: system
        pass_filenames: false
      - id: python-tests
        name: python tests
        entry: python -m unittest discover -s app/test -p 'test_*.py' -v
        language: system
        pass_filenames: false
      - id: python-compile
        name: python compile
        entry: python -m compileall -q app
        language: system
        pass_filenames: false
