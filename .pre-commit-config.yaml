repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check app.py journal.py test/test_journal.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy app.py journal.py
        language: system
        pass_filenames: false
      - id: python-tests
        name: python tests
        entry: python -m unittest discover -s test -p 'test_*.py' -v
        language: system
        pass_filenames: false
      - id: python-compile
        name: python compile
        entry: python -m compileall -q app.py journal.py
        language: system
        pass_filenames: false
